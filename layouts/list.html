{{ define "main" }}
<article class="art">
<h1>{{ .Title }}</h1>
{{ with .Params.lead | default .Description }}<p class="lead">{{ . }}</p>{{ end }}
{{ .Content }}
<section style="margin-top:36px">{{ range .RegularPages.ByDate.Reverse }}{{ partial "entry.html" . }}{{ end }}</section>
</article>
{{ end }}
