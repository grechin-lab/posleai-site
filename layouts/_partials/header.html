<header class="top">
<a class="mark" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, на главную"><span class="logo">{{ partial "logo.html" . }}</span></a>
<nav class="nav" aria-label="Разделы">
{{- $cur := . }}
{{- range site.Menus.main }}
{{- $on := or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) (and .Page (eq .Page.Section $cur.Section) (ne $cur.Section "") (not $cur.IsHome)) }}
<a href="{{ .URL | relURL }}"{{ if $on }} class="on" aria-current="page"{{ end }}>{{ .Name }}</a>
{{- end }}
<button type="button" class="tg" id="tg" aria-label="Тёмная тема" aria-pressed="false">
<svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
</button>
</nav>
</header>
