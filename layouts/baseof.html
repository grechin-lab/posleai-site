<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | absURL }}">
<link rel="alternate" type="text/plain" title="llms.txt" href="{{ "llms.txt" | absURL }}">
{{ with .OutputFormats.Get "markdown" }}<link rel="alternate" type="text/markdown" href="{{ .Permalink }}">{{ end }}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
{{ with .Params.image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
{{ partial "schema.html" . }}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f7f6f2;--surface:#fff;--fg:#141412;--muted:#5e5c56;--line:#dcdad3;--line-soft:#ecebe6;--accent:#2a78d6;--qb:#eb6834;--good:#008300;--warn:#eda100;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--surface:#1f1f1c;--fg:#f0efec;--muted:#b8b6ad;--line:#3a3936;--line-soft:#2b2a27;--accent:#3987e5;--qb:#d95926;--good:#2ea82e;--warn:#c98500;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.prose{max-width:720px}
header.site{border-bottom:1px solid var(--line);background:var(--surface)}
header.site .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
header.site a{color:var(--fg);text-decoration:none}.logo{font-family:var(--mono);font-weight:500;letter-spacing:-.01em}
nav a{margin-left:20px;color:var(--muted);font-size:14px}nav a:hover{color:var(--fg)}
main{padding:32px 0 64px}
h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
h2{font-size:21px;font-weight:600;margin:36px 0 8px;letter-spacing:-.005em}
h3{font-size:17px;font-weight:600;margin:28px 0 6px}
.lead{color:var(--muted);font-size:17px;max-width:68ch;margin:8px 0 0}
.meta{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:12px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.list li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.list a{font-size:17px;font-weight:600;text-decoration:none;color:var(--fg)}.list a:hover{color:var(--accent)}
.list p{margin:4px 0 0;color:var(--muted);font-size:14.5px}.list .meta{margin-top:4px}
article.post{display:grid;gap:0}
article.post>header{margin-bottom:24px;max-width:860px}
.body>*{max-width:720px}
.body>.wide,.body>.tiles,.body>.tbl,.body>figure{max-width:none}
.body img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
blockquote{margin:20px 0;padding:12px 16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;color:var(--fg)}
blockquote p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--line-soft);padding:1px 5px;border-radius:4px}
pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}pre code{background:none;padding:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:24px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:24px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}tr:hover td{background:var(--line-soft)}
figure{margin:24px 0}figure .card{padding:16px}figcaption{color:var(--muted);font-size:13px;margin-top:8px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:12px 16px;margin:20px 0;font-size:15px}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:13px}
#q{width:100%;max-width:720px;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);margin:16px 0}
</style>
</head>
<body>
<header class="site"><div class="wrap">
<a class="logo" href="/">{{ site.Title }}</a>
<nav><a href="/articles/">Статьи</a><a href="/about/">О проекте</a></nav>
</div></header>
<main><div class="wrap">{{ block "main" . }}{{ end }}</div></main>
<footer><div class="wrap">© {{ now.Year }} {{ site.Title }} · <a href="/index.xml">RSS</a> · <a href="/llms.txt">llms.txt</a></div></footer>
</body>
</html>
