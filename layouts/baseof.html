<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<div class="site" id="site">
<script>(function(){try{var t=localStorage.getItem('posle-theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;if(d){document.getElementById('site').classList.add('dark');document.documentElement.classList.add('dark')}}catch(e){}})();</script>
<a class="skip" href="#main">К содержанию</a>
<div class="wrap">
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</div>
</div>
{{ with resources.Get "js/theme.js" | minify | fingerprint }}<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>{{ end }}
</body>
</html>
