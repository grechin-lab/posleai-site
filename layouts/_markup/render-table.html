<div class="tbl"><table>
<thead>{{- range .THead }}<tr>{{ range . }}<th{{ with .Alignment }}{{ if eq . "right" }} class="n"{{ end }}{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end -}}</thead>
<tbody>{{- range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }}{{ if eq . "right" }} class="n"{{ end }}{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end -}}</tbody>
</table></div>
